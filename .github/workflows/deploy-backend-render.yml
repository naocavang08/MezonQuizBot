name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-backend-render.yml"
      - "MezonQuiz/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-backend-render.yml"
      - "MezonQuiz/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mezonquiz-api

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MezonQuiz/src/xUTest/xUTest.csproj

      - name: Test
        run: dotnet test MezonQuiz/src/xUTest/xUTest.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -t mezonquiz-api:ci MezonQuiz

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Set image tags
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}"
          echo "sha_tag=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate production appsettings
        env:
          APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}
        run: |
          test -n "$APPSETTINGS_PRODUCTION"
          printf '%s' "$APPSETTINGS_PRODUCTION" > MezonQuiz/src/WebApp/appsettings.Production.json
          jq -e . MezonQuiz/src/WebApp/appsettings.Production.json > /dev/null

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: MezonQuiz
          file: MezonQuiz/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name != 'pull_request'
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Require Render deploy hook
        run: test -n "$DEPLOY_WEBHOOK_URL"

      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"

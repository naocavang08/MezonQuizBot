name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-backend-render.yml"
      - "MezonQuiz/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-backend-render.yml"
      - "MezonQuiz/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MezonQuiz/src/xUTest/xUTest.csproj

      - name: Test
        run: dotnet test MezonQuiz/src/xUTest/xUTest.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -t mezonquiz-api:ci MezonQuiz

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Require Render deploy hook
        run: test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
